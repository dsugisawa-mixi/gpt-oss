<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1226">
<title>Conversation — Professor LT</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0d1226 0%, #16213e 50%, #0f3460 100%);
    color: #e6e6f0;
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 12px 18px;
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(233, 69, 96, 0.4);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header h1 { font-size: 1.05em; color: #f5f5fa; }
  header .meta { font-size: 0.78em; color: #98a0c0; }
  header .spacer { flex: 1; }
  header .me { font-size: 0.85em; color: #c0c8e0; }
  header button {
    background: transparent;
    color: #c0c8e0;
    border: 1px solid #3a4870;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font: inherit;
  }
  header button:hover { border-color: #e94560; color: #fff; }

  main {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 14px;
    padding: 14px;
    overflow: hidden;
  }
  aside, section {
    background: rgba(15, 22, 46, 0.85);
    border: 1px solid #2a3553;
    border-radius: 10px;
    padding: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  h2 { font-size: 0.95em; color: #f5f5fa; margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; }
  h2 .count { color: #98a0c0; font-weight: normal; font-size: 0.85em; }
  h2 .target { color: #98a0c0; font-weight: normal; font-size: 0.85em; }

  #labs-list { overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
  .lab {
    display: block; width: 100%; text-align: left;
    background: rgba(30, 42, 74, 0.7);
    color: #d6dcef;
    border: 1px solid #2a3553;
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    font: inherit;
    font-size: 0.9em;
    line-height: 1.3;
  }
  .lab:hover { border-color: #4a5b8a; }
  .lab.selected { background: #1a2447; border-color: #5d7ab6; color: #fff; }

  /* compose form */
  #compose { display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .voice-group { display: flex; gap: 14px; align-items: center; }
  .voice-group label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9em; color: #d6dcef; cursor: pointer; }
  .voice-group input[type=radio] { accent-color: #e94560; }
  textarea {
    width: 100%;
    min-height: 120px;
    background: #0e1530;
    color: #e6e6f0;
    border: 1px solid #3a4870;
    border-radius: 6px;
    padding: 10px 12px;
    font: inherit;
    font-size: 0.95em;
    line-height: 1.45;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #5d7ab6; }
  button.primary {
    background: #e94560;
    border: 1px solid #e94560;
    color: #fff;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
    font-size: 0.95em;
  }
  button.primary:hover { background: #d93553; }
  button.primary:disabled { background: #3a4870; border-color: #3a4870; cursor: not-allowed; }
  .hint { font-size: 0.78em; color: #98a0c0; }

  /* recent publish ring */
  #recent-head { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #recent-head .label { font-size: 0.85em; color: #98a0c0; }
  #recent-list {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    border: 1px solid #1f2a4a;
    border-radius: 6px;
    background: #0b1228;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .pub-item {
    padding: 6px 10px;
    border: 1px solid #1f2a4a;
    border-radius: 6px;
    background: rgba(30, 42, 74, 0.5);
    font-size: 0.88em;
    line-height: 1.4;
  }
  .pub-item .head { display: flex; gap: 8px; align-items: baseline; color: #98a0c0; font-size: 0.78em; margin-bottom: 2px; flex-wrap: wrap; }
  .pub-item .head .pid { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pub-item .head .name { color: #d6dcef; }
  .voice-badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 0.72em;
    border: 1px solid #3a4870;
    line-height: 1.4;
  }
  .voice-badge.male { background: #1c2f4a; border-color: #2f5680; color: #aac8e8; }
  .voice-badge.female { background: #3a1f3a; border-color: #6b3a6b; color: #e8b8e8; }
  .voice-badge.unknown { background: #1f2a4a; border-color: #3a4870; color: #98a0c0; }
  .pub-item .body { color: #e6e6f0; white-space: pre-wrap; word-break: break-word; }
  .muted { color: #98a0c0; }
  .small { font-size: 0.85em; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1d3a2a; color: #d8f0e0;
    border: 1px solid #2c5a3f;
    padding: 10px 18px; border-radius: 8px;
    font-size: 0.9em;
    z-index: 200;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #toast[hidden] { display: none; }
  #toast.error { background: #4a1c30; border-color: #6e2942; color: #f0c8d0; }

  #banner {
    background: #5a1622;
    color: #fff;
    padding: 10px 18px;
    text-align: center;
    font-size: 0.9em;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  #banner[hidden] { display: none; }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="banner" hidden></div>
<header>
  <h1>Conversation</h1>
  <span class="meta">対象 Lab に「発言」を投稿</span>
  <span class="spacer"></span>
  <span class="me" id="me-name">—</span>
  <button id="btn-logout" type="button">ログアウト</button>
</header>

<main>
  <aside>
    <h2>Lab一覧 <span class="count" id="labs-count">0</span></h2>
    <div id="labs-list"><div class="muted small">読み込み中…</div></div>
  </aside>

  <section>
    <h2>発言 <span class="target" id="speak-target">— Lab未選択 —</span></h2>
    <div id="compose">
      <div class="row voice-group">
        <span class="hint">話者:</span>
        <label><input type="radio" name="voice" value="male" checked>男性 (male)</label>
        <label><input type="radio" name="voice" value="female">女性 (female)</label>
      </div>
      <textarea id="msg" placeholder="メッセージを入力 (Ctrl/Cmd+Enter で送信)" disabled></textarea>
      <div class="row">
        <button class="primary" id="btn-publish" type="button" disabled>発言</button>
        <span class="hint" id="hint">— Lab を選んでください —</span>
      </div>
      <div id="recent-head">
        <span class="label">直近の発言 (publish ring)</span>
      </div>
      <div id="recent-list"><div class="muted small">— —</div></div>
    </div>
  </section>
</main>

<div id="toast" hidden></div>

<script type="module">
import {
  ensureGoogleSignIn,
  signInWithLab,
  getAuthHeaders,
  getUserIdMap,
  clearStoredSession,
} from "/js/auth.js";

let USER_IDS = {};
const state = {
  displayName: null,
  email: null,
  operatorId: null,
  operatorName: null,
  labels: {},          // operator.id -> human label
  labIds: {},          // operator.id -> lab.lab_id
  lastPublishId: 0,    // tail cursor for /api/qa/timeline?publish=1
  pubPollTimer: null,
};

const _labAuthInFlight = {};
function kickLabAuth(opId, labId) {
  if (!opId || !labId) return;
  if (USER_IDS[labId]) return;
  if (_labAuthInFlight[opId]) return;
  _labAuthInFlight[opId] = (async () => {
    try {
      const res = await signInWithLab({ opId, labId });
      if (res && res.userId) {
        USER_IDS[labId] = res.userId;
        if (res.displayName && !state.displayName) {
          state.displayName = res.displayName;
          $("me-name").textContent = res.displayName;
        }
      }
    } catch (e) {
      console.warn(`[lab-auth] sign-in failed op=${opId} lab=${labId}:`, e.message);
    } finally {
      delete _labAuthInFlight[opId];
    }
  })();
}

function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}
function formatTs(t) {
  if (!t) return "—";
  const d = new Date(Number(t) * 1000);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleTimeString();
}
function withLab(path, opId) {
  if (!opId) return path;
  const sep = path.includes("?") ? "&" : "?";
  return `${path}${sep}operator_id=${encodeURIComponent(opId)}`;
}
function showBanner(msg) {
  const el = $("banner");
  el.textContent = msg;
  el.hidden = false;
}
function hideBanner() { $("banner").hidden = true; }
let toastTimer;
function showToast(msg, kind = "info") {
  const t = $("toast");
  t.textContent = msg;
  t.className = kind === "error" ? "error" : "";
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}
async function readDetail(r) {
  try { return (await r.json()).detail || ""; } catch (_) { return ""; }
}
function selectedVoice() {
  const el = document.querySelector('input[name="voice"]:checked');
  return el ? el.value : "male";
}

async function refreshLabs() {
  let r;
  try { r = await fetch("/api/tunnel/info"); } catch (_) { return; }
  if (!r.ok) return;
  const d = await r.json();
  const ops = Array.isArray(d.operators) ? d.operators : [];
  $("labs-count").textContent = ops.length;
  const list = $("labs-list");
  list.innerHTML = "";

  state.labels = {};
  state.labIds = {};
  for (const op of ops) {
    state.labels[op.id] = (op.lab && (op.lab.name || op.lab.lab_id))
      || op.name || (op.id ? op.id.slice(0, 6) : "Lab");
    const labId = op.lab && op.lab.lab_id;
    if (labId) {
      state.labIds[op.id] = labId;
      kickLabAuth(op.id, labId);
    }
  }
  if (state.operatorId && !state.labels[state.operatorId]) {
    deselectLab("選択していた Lab が切断されました");
  }

  if (!ops.length) {
    list.innerHTML = `<div class="muted small">接続中の Lab はありません。</div>`;
    return;
  }
  for (const op of ops) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "lab" + (state.operatorId === op.id ? " selected" : "");
    btn.textContent = state.labels[op.id];
    btn.onclick = () => selectLab(op.id);
    list.appendChild(btn);
  }
}

function deselectLab(reason) {
  state.operatorId = null;
  state.operatorName = null;
  $("speak-target").textContent = "— Lab未選択 —";
  $("btn-publish").disabled = true;
  $("msg").disabled = true;
  $("hint").textContent = reason || "— Lab を選んでください —";
  $("recent-list").innerHTML = `<div class="muted small">— —</div>`;
  state.lastPublishId = 0;
  if (state.pubPollTimer) {
    clearInterval(state.pubPollTimer);
    state.pubPollTimer = null;
  }
}

function selectLab(opId) {
  state.operatorId = opId;
  state.operatorName = state.labels[opId] || opId;
  $("speak-target").textContent = `→ ${state.operatorName}`;
  $("btn-publish").disabled = false;
  $("msg").disabled = false;
  $("hint").textContent = "Ctrl/Cmd+Enter で送信";
  document.querySelectorAll("#labs-list .lab").forEach(b => {
    b.classList.toggle("selected", b.textContent === state.operatorName);
  });
  state.lastPublishId = 0;
  $("recent-list").innerHTML = `<div class="muted small">読み込み中…</div>`;
  refreshRecent(/*reset=*/true);
  if (state.pubPollTimer) clearInterval(state.pubPollTimer);
  state.pubPollTimer = setInterval(() => refreshRecent(false), 4000);
}

async function publishMessage() {
  if (!state.operatorId) return;
  const labId = state.labIds[state.operatorId];
  const uid = labId ? USER_IDS[labId] : null;
  if (!uid) {
    showToast(`このLabにサインインしていません (lab=${labId || "?"})`, "error");
    return;
  }
  const msg = $("msg").value.trim();
  if (!msg) {
    showToast("メッセージを入力してください", "error");
    return;
  }
  const voice = selectedVoice();
  const btn = $("btn-publish");
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = "送信中…";
  try {
    const r = await fetch(withLab("/api/chat", state.operatorId), {
      method: "POST",
      headers: getAuthHeaders(USER_IDS),
      body: JSON.stringify({
        user_id: uid,
        stage: "qa",
        message: msg,
        publish: true,
        voice,
      }),
    });
    if (!r.ok) {
      const det = await readDetail(r);
      showToast(`HTTP ${r.status}: ${det || "発言失敗"}`, "error");
      return;
    }
    const d = await r.json();
    const pid = (d && d.accuracy && d.accuracy.publish_id) || "?";
    showToast(`発言 → ${state.operatorName} (publish_id=${pid}, voice=${voice})`);
    $("msg").value = "";
    refreshRecent(false);
  } catch (e) {
    showToast("通信エラー: " + e.message, "error");
  } finally {
    btn.textContent = orig;
    btn.disabled = !state.operatorId;
  }
}

async function refreshRecent(reset) {
  if (!state.operatorId) return;
  if (reset) state.lastPublishId = 0;
  const labId = state.labIds[state.operatorId];
  const uid = labId ? USER_IDS[labId] : null;
  if (!uid) return;
  let r;
  try {
    r = await fetch(
      withLab(`/api/qa/timeline?publish=1&start=0&end=-1&limit=20`, state.operatorId),
      { headers: getAuthHeaders(USER_IDS) },
    );
  } catch (_) { return; }
  if (!r.ok) {
    if (reset) {
      const det = await readDetail(r);
      $("recent-list").innerHTML =
        `<div class="muted small">読み込み失敗 HTTP ${r.status}: ${escapeHtml(det)}</div>`;
    }
    return;
  }
  const d = await r.json();
  const items = Array.isArray(d.items) ? d.items.slice() : [];
  items.sort((a, b) => b.publish_id - a.publish_id);
  state.lastPublishId = d.max_publish_id || state.lastPublishId;
  const list = $("recent-list");
  if (!items.length) {
    list.innerHTML = `<div class="muted small">— 発言なし —</div>`;
    return;
  }
  list.innerHTML = "";
  for (const it of items) {
    const div = document.createElement("div");
    div.className = "pub-item";
    const v = String(it.voice || "").toLowerCase();
    const cls = v === "male" || v === "female" ? v : "unknown";
    const txt = v === "male" ? "♂ male"
              : v === "female" ? "♀ female"
              : "voice=?";
    div.innerHTML = `
      <div class="head">
        <span class="pid">#${escapeHtml(it.publish_id)}</span>
        <span class="name">${escapeHtml(it.label || "(no name)")}</span>
        <span class="voice-badge ${cls}">${escapeHtml(txt)}</span>
        <span>${escapeHtml(formatTs(it.ts))}</span>
      </div>
      <div class="body">${escapeHtml(it.message || "")}</div>`;
    list.appendChild(div);
  }
}

async function logout() {
  try {
    await fetch("/api/auth/logout", {
      method: "POST",
      headers: getAuthHeaders(USER_IDS),
    });
  } catch (_) { /* best-effort */ }
  clearStoredSession();
  location.reload();
}

async function init() {
  const session = await ensureGoogleSignIn();
  if (!session) return;
  USER_IDS = getUserIdMap();
  state.displayName = session.displayName
    || localStorage.getItem("professor_display_name");
  state.email = session.email || null;
  $("me-name").textContent = state.displayName || "(authenticated)";
  $("btn-logout").onclick = logout;
  $("btn-publish").onclick = publishMessage;

  $("msg").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (e.isComposing || e.keyCode === 229) return;
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    publishMessage();
  });

  await refreshLabs();
  setInterval(refreshLabs, 5000);
}

init();
</script>
</body>
</html>
